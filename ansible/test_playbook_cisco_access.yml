---

- name: Network Getting Started First Playbook
  connection: ansible.netcommon.network_cli
  gather_facts: false
  hosts: ciscos_access
  tasks:

    - name: Set hostname
      cisco.ios.ios_hostname:
        config:
          hostname: "{{ inventory_hostname }}"
        state: merged

    - name: Create user vlan
      cisco.ios.ios_vlans:
        config:
          - name: lan
            vlan_id: "{{ inventory_hostname.split('-')[-1]|int + 100 }}"
            state: active
            shutdown: disabled
        state: merged

    - name: Config trunk ifaces
      cisco.ios.ios_l2_interfaces:
        config:
          - name: "{{ uplink_port }}"
            mode: trunk
            trunk:
              allowed_vlans: "{{ inventory_hostname.split('-')[-1]|int + 100 }}"
              encapsulation: dot1q
        state: merged

    - name: Config access ifaces
      cisco.ios.ios_l2_interfaces:
        config:
          - name: "{{ item }}"
            mode: access
            access:
              vlan: "{{ inventory_hostname.split('-')[-1]|int + 100 }}"
        state: merged
      loop: "{{ lan_ports }}"