---

- name: Network Getting Started First Playbook
  connection: ansible.netcommon.network_cli
  gather_facts: false
  hosts: ciscos
  tasks:

    - name: Get config for IOS devices
      cisco.ios.ios_facts:
        gather_subset: min

    - name: Backup the config
      cisco.ios.ios_config:
        backup: yes
        backup_options:
          filename: "{{ ansible_net_hostname }}.cfg"
      register: res

    - name: Display res
      debug:
        var: res      
